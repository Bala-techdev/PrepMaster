spring.application.name=codingPlatfom

# Datasource: MySQL 8
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/prepmaster?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# Flyway versioned migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Web / error handling
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never

# Authentication settings
app.jwt.secret=${JWT_SECRET:placeholder-secret}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}

# OAuth2 / Security fix for Google Client
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
app.auth.google-enabled=${GOOGLE_AUTH_ENABLED:false}

# Redis & ATS Storage
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
app.security.redis-enabled=${AUTH_REDIS_ENABLED:false}
spring.servlet.multipart.max-file-size=${ATS_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${ATS_MAX_REQUEST_SIZE:12MB}
app.ats.storage-dir=${ATS_STORAGE_DIR:data/resumes}
app.ats.free-scans-per-month=${ATS_FREE_SCANS_PER_MONTH:2}
app.ats.premium-scans-per-month=${ATS_PREMIUM_SCANS_PER_MONTH:100}