spring.application.name=codingPlatfom

# ---------------------------------------------------------------------------
# Datasource: MySQL 8 (development / production).
# Credentials are supplied through environment variables and are never
# committed. Override the whole URL with DB_URL when needed.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/prepmaster?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------------------------------------------------------------------------
# JPA / Hibernate.
# The schema is owned by Flyway. Hibernate may only verify that the mappings
# match the migrated schema - it must never create or alter tables.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

# ---------------------------------------------------------------------------
# Flyway versioned migrations.
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ---------------------------------------------------------------------------
# Web / error handling.
# ---------------------------------------------------------------------------
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never

# Authentication settings. Set JWT_SECRET in shared or deployed environments.
# The fallback is for local development only and is not a production secret.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:900}
