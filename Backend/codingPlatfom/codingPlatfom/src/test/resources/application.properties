# Test configuration.
#
# This file shadows src/main/resources/application.properties on the test
# classpath, so tests never touch the MySQL development database. The URL
# below is an in-memory H2 database running in MySQL compatibility mode, and
# the very same Flyway migrations from classpath:db/migration are applied.

spring.datasource.url=jdbc:h2:mem:prepmaster_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Same contract as production: Flyway builds the schema, Hibernate validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

app.jwt.secret=test-only-secret-key-that-is-at-least-32-bytes
app.jwt.expiration-seconds=900
